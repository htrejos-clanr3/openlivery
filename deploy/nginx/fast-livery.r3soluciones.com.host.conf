# Host nginx vhost for Fast Livery (sibling of Red Ayuda / Yarumo).
# App gateway listens on 127.0.0.1:3020 (Caddy compose proxy).
#
#   sudo cp deploy/nginx/fast-livery.r3soluciones.com.host.conf /etc/nginx/conf.d/fast-livery.r3soluciones.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx --redirect -d fast-livery.r3soluciones.com

server {
    listen 80;
    listen [::]:80;
    server_name fast-livery.r3soluciones.com;

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:3020;
        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
