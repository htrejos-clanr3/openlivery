name: Deploy to production

# Builds the stack on the server instead of pulling images. The publish workflow
# exists for GHCR, but production does not depend on it: a failed package push
# must not block a deploy.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Package the tree
        run: git archive --format=tar.gz -o deploy.tar.gz HEAD

      - name: Copy to the server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy.tar.gz
          target: ${{ secrets.DEPLOY_PATH || '/opt/fast-livery' }}

      - name: Build and start
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH || '/opt/fast-livery' }}
            tar xzf deploy.tar.gz
            rm -f deploy.tar.gz
            sed -i "s/^commit=.*/commit=${{ github.sha }}/" DEPLOY_SOURCE.txt
            sudo docker compose -p fast-livery --env-file .env.docker up -d --build
            sudo docker ps --format '{{.Names}} {{.Status}}' | grep openlivery

      - name: Verify the deployment
        run: |
          set -e
          for i in $(seq 1 20); do
            code=$(curl -s -o /dev/null -w '%{http_code}' https://fast-livery.r3soluciones.com/api/health || true)
            if [ "$code" = "200" ]; then break; fi
            sleep 15
          done
          test "$code" = "200" || { echo "health returned $code"; exit 1; }
          curl -s -o /dev/null -w 'web: %{http_code}\n' https://fast-livery.r3soluciones.com/login

      - name: Fail if anything is unhealthy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/opt/fast-livery' }}
            sudo docker ps --format '{{.Names}} {{.Status}}' | grep openlivery | grep -v healthy || echo "all healthy"
